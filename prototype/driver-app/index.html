<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver App Prototype · Amoeba Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Driver App Prototype — Amoeba Fleet (car-manager-v2)
     Mobile/PWA driver UI. Theme: Car (blue) / Truck (orange).
     i18n: VI / EN / KO — UI labels from messages/{vi,en,ko}.json,
     sample content translated inline.
     Menu mirrors nav-items.ts DRIVER: today · tripsMine · expensesNew · me
     ============================================================ */
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F3F8;
    --border:#E2E5EB; --border-strong:#CBD2DC;
    --text:#0F172A; --text-muted:#475569; --text-faint:#64748B;
    --success:#15A36E; --success-soft:#E3F7EE;
    --warning:#F59E0B; --warning-soft:#FEF3C7; --warning-ink:#B45309;
    --danger:#EF4444;  --danger-soft:#FEE2E2;
    --info:#0EA5E9;    --info-soft:#E0F2FE;
    --neutral-soft:#F1F3F8; --neutral-ink:#475569;
    --accent:#0369A1; --accent-strong:#025d8a; --accent-soft:#E0F2FE;
  }
  body[data-theme="truck"]{ --accent:#C2410C; --accent-strong:#9A3412; --accent-soft:#FBEADF; }
  body{font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background:#E2E8F0;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding:24px 16px 48px;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}

  .controls{max-width:920px;margin:0 auto 24px;display:flex;flex-direction:column;gap:14px;align-items:center;}
  .controls h1{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .controls p{font-size:13px;color:#475569;text-align:center;max-width:600px;line-height:1.5;}
  .ctl-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;box-shadow:0 1px 3px rgba(15,23,42,.06);}
  .seg button{border:none;background:transparent;font:600 13px/1 'Be Vietnam Pro';color:#64748B;padding:9px 16px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(15,23,42,.18);}
  .seg.small button{padding:7px 12px;font-size:12px;}
  .seg.small button.on{background:var(--text);color:#fff;}

  .phone{width:390px;max-width:100%;height:800px;margin:0 auto;background:var(--bg);border-radius:38px;border:11px solid #0F172A;box-shadow:0 24px 60px -18px rgba(15,23,42,.5);overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#0F172A;border-radius:0 0 16px 16px;z-index:60;}

  .appbar{flex-shrink:0;height:74px;padding:18px 18px 8px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:40;position:relative;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand .logo{height:34px;width:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .brand .t1{font-size:11px;color:var(--text-faint);font-weight:500;line-height:1.1;}
  .brand .t2{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;}
  .lang{font-size:12px;font-weight:700;color:var(--text-muted);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;background:var(--surface);}
  .lang:hover{border-color:var(--accent);color:var(--accent);}
  .langmenu{position:absolute;top:64px;right:18px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px -8px rgba(15,23,42,.25);padding:5px;z-index:80;min-width:130px;}
  .langmenu button{width:100%;text-align:left;border:none;background:transparent;font:600 13px/1 'Be Vietnam Pro';color:var(--text);padding:10px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .langmenu button:hover{background:var(--surface-2);}
  .langmenu button.on{color:var(--accent);}

  .body{flex:1;overflow-y:auto;padding:16px 16px 200px;display:flex;flex-direction:column;gap:14px;}
  .body::-webkit-scrollbar{width:0;}
  .body>*{flex-shrink:0;}
  .scrn-title{font-size:19px;font-weight:800;letter-spacing:-.01em;padding:2px 2px 0;}
  .scrn-sub{font-size:12.5px;color:var(--text-faint);padding:0 2px 4px;margin-top:-6px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.04);overflow:hidden;}
  .card-head{padding:13px 16px;border-bottom:1px solid #EFF1F5;display:flex;align-items:center;justify-content:space-between;}
  .card-head .ttl{font-size:14px;font-weight:700;}
  .card-head .meta{font-size:11.5px;color:var(--text-faint);}
  .link{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;cursor:pointer;}

  .bdg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .bdg.warning{background:var(--warning-soft);color:var(--warning-ink);}
  .bdg.success{background:var(--success-soft);color:var(--success);}
  .bdg.info{background:var(--info-soft);color:#0369A1;}
  .bdg.neutral{background:var(--neutral-soft);color:var(--neutral-ink);}
  .bdg.danger{background:var(--danger-soft);color:var(--danger);}

  .hero-banner{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;}
  .hero-banner.confirm{background:linear-gradient(135deg,var(--warning),var(--info));}
  .hero-banner.ready{background:linear-gradient(135deg,var(--accent),var(--info));}
  .hero-banner.active{background:linear-gradient(135deg,var(--info),var(--accent) 60%,var(--info));}
  .hero-banner .sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.92;}
  .hero-banner .ref{font-size:18px;font-weight:800;margin-top:2px;}
  .badge-w{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;}

  .hero-body{padding:16px 18px;}
  .pax{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .avatar{height:44px;width:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
  .avatar.sm{height:38px;width:38px;font-size:13px;}
  .pax .nm{font-size:15px;font-weight:700;}
  .pax .pp{font-size:13px;color:var(--text-muted);margin-top:1px;}

  .route{padding-top:15px;display:flex;flex-direction:column;gap:14px;}
  .step{display:flex;align-items:flex-start;gap:12px;}
  .step .dot{height:36px;width:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step.from .dot{background:var(--accent-soft);color:var(--accent);}
  .step.to .dot{background:var(--success-soft);color:var(--success);}
  .step .lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);}
  .step .val{font-size:15px;font-weight:700;line-height:1.3;margin-top:2px;}
  .meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px;font-size:13px;color:var(--text-muted);}
  .meta-row .it{display:inline-flex;align-items:center;gap:6px;}
  .meta-row .it b{color:var(--text);font-weight:700;}

  .rows{display:flex;flex-direction:column;}
  .row{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid #EFF1F5;text-decoration:none;color:inherit;cursor:pointer;}
  .row:last-child{border-bottom:none;}
  .row .rref{font-size:11px;color:var(--text-faint);flex-shrink:0;width:58px;}
  .row .rmid{flex:1;min-width:0;}
  .row .rmid .rt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .rmid .rs{font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .rtime{font-size:11.5px;color:var(--text-muted);text-align:right;flex-shrink:0;}
  .chev{color:var(--text-faint);flex-shrink:0;}

  .veh{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;margin:0 12px 8px;}
  .veh:first-of-type{margin-top:12px;}
  .veh .vico{height:38px;width:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .veh .vp{font-size:13.5px;font-weight:700;}
  .veh .vm{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .veh .vd{font-size:10.5px;color:var(--text-faint);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}

  .subtabs{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:4px;gap:3px;}
  .subtabs button{border:none;background:transparent;font:600 13px/1 'Be Vietnam Pro';color:var(--text-muted);padding:9px 16px;border-radius:6px;cursor:pointer;}
  .subtabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.1);}
  .tcard{display:block;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:13px 14px;text-decoration:none;color:inherit;cursor:pointer;}
  .tcard+.tcard{margin-top:10px;}
  .tcard .top{display:flex;align-items:flex-start;gap:11px;}
  .tcard .tref{font-size:10.5px;color:var(--text-faint);}
  .tcard .tnm{font-size:14.5px;font-weight:700;line-height:1.2;}
  .tcard .trt{margin-top:7px;font-size:12px;color:var(--text-muted);line-height:1.4;}
  .tcard .tmeta{margin-top:6px;font-size:11.5px;color:var(--text-muted);display:flex;gap:7px;align-items:center;}

  .ecard{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:13px 14px;}
  .ecard+.ecard{margin-top:9px;}
  .ecard .eico{height:36px;width:36px;border-radius:50%;background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ecard .etp{font-size:14px;font-weight:700;}
  .ecard .edt{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .ecard .eamt{font-size:15px;font-weight:800;text-align:right;}
  .ecard .enote{font-size:11.5px;color:var(--danger);margin-top:6px;line-height:1.4;}
  .btn-block{width:100%;height:48px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;font:700 14px/1 'Be Vietnam Pro';display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}

  .field{margin-bottom:16px;}
  .field>label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:8px;}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .chip{border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 4px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .chip .cic{height:36px;width:36px;border-radius:50%;background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;}
  .chip.on .cic{background:var(--accent);color:#fff;}
  .chip span{font-size:11px;font-weight:600;line-height:1.1;}
  .amount{width:100%;height:56px;border:1.5px solid var(--border);border-radius:12px;padding:0 16px;font:800 22px/1 'JetBrains Mono';color:var(--text);background:var(--surface);}
  .amount::placeholder{color:var(--border-strong);}
  textarea.note{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font:500 14px/1.4 'Be Vietnam Pro';resize:none;color:var(--text);background:var(--surface);}
  .receipt{border:1.5px dashed var(--border-strong);border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-faint);text-align:center;}

  .prof{display:flex;align-items:center;gap:14px;padding:18px;}
  .prof .pav{height:56px;width:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;}
  .prof .pn{font-size:17px;font-weight:800;}
  .prof .pe{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .kv{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #EFF1F5;font-size:13.5px;gap:12px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-muted);}
  .kv .v{font-weight:600;text-align:right;}
  .langopts{display:flex;gap:8px;padding:14px 16px;}
  .langopts button{flex:1;border:1.5px solid var(--border);background:var(--surface);border-radius:9px;padding:10px;font:600 13px/1 'Be Vietnam Pro';color:var(--text-muted);cursor:pointer;}
  .langopts button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;}
  .tg{width:42px;height:24px;border-radius:999px;position:relative;flex-shrink:0;}
  .tg.on{background:var(--accent);}.tg.off{background:#D1D5DB;}
  .tg span{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;}
  .tg.on span{right:2px;}.tg.off span{left:2px;}
  .logout{margin:4px 0;width:100%;height:50px;border:1.5px solid #FCA5A5;background:#fff;color:var(--danger);border-radius:12px;font:700 15px/1 'Be Vietnam Pro';display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}

  .status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .when{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
  .map{height:188px;border-radius:14px;border:1px solid var(--border);background:linear-gradient(0deg,rgba(255,255,255,.4),rgba(255,255,255,.4)),repeating-linear-gradient(45deg,#E8EEF4 0 14px,#EEF3F8 14px 28px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .map .pin{position:absolute;display:flex;flex-direction:column;align-items:center;}
  .map .pin.a{top:34%;left:26%;color:var(--accent);}
  .map .pin.b{top:58%;left:64%;color:var(--success);}
  .map .ln{position:absolute;top:42%;left:30%;width:40%;height:24%;border-bottom:3px dashed var(--accent);border-right:3px dashed var(--accent);border-radius:0 0 30px 0;opacity:.5;}
  .map .tag{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-muted);z-index:2;}
  .sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .sec .sttl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:12px;}
  .contact-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .cbtn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;text-decoration:none;min-height:42px;}
  .cbtn.call{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);}
  .cbtn.mail{border:1px solid var(--border);background:var(--surface-2);color:var(--text);}
  .prop{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;}
  .prop:last-child{margin-bottom:0;}
  .backlink{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;padding:2px;}

  .actionbar{position:absolute;left:0;right:0;bottom:58px;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);box-shadow:0 -6px 20px -10px rgba(15,23,42,.18);padding:13px 16px;display:flex;flex-direction:column;gap:9px;}
  .btn{width:100%;height:54px;border:none;border-radius:12px;font:700 16px/1 'Be Vietnam Pro';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.dark{background:var(--text);color:#fff;}
  .btn.danger{background:#fff;border:1.5px solid #FCA5A5;color:var(--danger);height:48px;font-size:15px;}
  .btn.ghost{background:var(--surface-2);color:var(--text-muted);height:46px;font-size:14px;}
  .ab-2{display:flex;gap:9px;}.ab-2 .btn{flex:1;}

  .tabnav{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:55;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);}
  .tab{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text-faint);font:600 9.5px/1.1 'Be Vietnam Pro';position:relative;padding:0 2px;text-align:center;}
  .tab.on{color:var(--accent);}
  .tab.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:2.5px;border-radius:2px;background:var(--accent);}
  svg{display:block;}
</style>
</head>
<body data-theme="car">

  <div class="controls">
    <h1>Driver App — Prototype</h1>
    <p id="introP"></p>
    <div class="ctl-row">
      <div class="seg" id="themeSeg">
        <button data-theme="car" class="on">🚗 <span data-i="vCar"></span></button>
        <button data-theme="truck">🚚 <span data-i="vTruck"></span></button>
      </div>
      <div class="seg" id="langSeg">
        <button data-lang="vi" class="on">Tiếng Việt</button>
        <button data-lang="en">English</button>
        <button data-lang="ko">한국어</button>
      </div>
    </div>
    <div class="seg small" id="stateSeg">
      <button data-state="ready" class="on" data-i="badgeReadyShort"></button>
      <button data-state="confirm" data-i="badgeConfirmShort"></button>
      <button data-state="active" data-i="badgeActiveShort"></button>
    </div>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="appbar">
      <div class="brand">
        <div class="logo" id="logo">XC</div>
        <div>
          <div class="t1">Amoeba Fleet</div>
          <div class="t2" id="brandSub">Tài xế · Xe con</div>
        </div>
      </div>
      <div class="lang" id="langBtn"><span id="langLabel">VI</span> ▾</div>
      <div class="langmenu" id="langMenu" style="display:none;">
        <button data-lang="vi">Tiếng Việt <span>VI</span></button>
        <button data-lang="en">English <span>EN</span></button>
        <button data-lang="ko">한국어 <span>KO</span></button>
      </div>
    </div>

    <div class="body" id="appBody"></div>
    <div id="actionMount"></div>
    <div class="tabnav" id="tabnav"></div>
  </div>

<script>
/* ============================== ICONS ============================== */
const I = {
  clock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',

function renderActionBar(){
  const s=STATE[cur.state];
  if(cur.screen==='today'||cur.screen==='detail'){
    let inner='';
    if(s.act==='confirm') inner=`<div class="ab-2"><button class="btn danger">${I.x} ${t('actReject')}</button><button class="btn primary" style="flex:1.4;">${I.check} ${t('actAccept')}</button></div>`;
    else if(s.act==='ready') inner=`<button class="btn primary">${I.play} ${t('actStart')}</button>`;
    else if(s.act==='active') inner=`<button class="btn dark">${I.stop} ${t('actEnd')}</button><button class="btn ghost">${I.receipt} ${t('actExpense')}</button>`;
    return `<div class="actionbar">${inner}</div>`;

  if(cur.screen==='expenseNew') return `<div class="actionbar"><button class="btn primary">${I.check} ${t('submitExp')}</button></div>`;
  return '';
}

function renderTabs(){
  const a=SCREEN_TAB[cur.screen];
  document.getElementById('tabnav').innerHTML = TABS.map(x=>`<button class="tab ${x.key===a?'on':''}" data-tab="${x.key}">${x.ic}<span>${t(x.l)}</span></button>`).join('');
}

/* ---------- static labels (controls + appbar) ---------- */
function applyStatic(){
  document.getElementById('introP').innerHTML = t('intro');
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = t(el.dataset.i); });
  document.getElementById('langLabel').textContent = LANG_LABEL[cur.lang];
  document.getElementById('brandSub').textContent = `${t('driverRole')} · ${cur.theme==='truck'?t('vTruck'):t('vCar')}`;
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===cur.lang));
  document.querySelectorAll('#langMenu button').forEach(b=>b.classList.toggle('on',b.dataset.lang===cur.lang));
}

/* ---------- mount ---------- */
function render(){
  document.body.setAttribute('data-theme',cur.theme);
  document.documentElement.lang = cur.lang;
  document.getElementById('logo').textContent = DATA[cur.theme].logo;
  applyStatic();

  const b=document.getElementById('appBody');
  if(cur.screen==='today') b.innerHTML=renderToday();
  else if(cur.screen==='detail') b.innerHTML=renderDetail();
  else if(cur.screen==='tripsMine') b.innerHTML=renderTrips();
  else if(cur.screen==='expensesNew') b.innerHTML=renderExpenses();
  else if(cur.screen==='expenseNew') b.innerHTML=renderExpenseNew();
  else if(cur.screen==='me') b.innerHTML=renderMe();

  document.getElementById('actionMount').innerHTML=renderActionBar();
  renderTabs();
  b.scrollTop=0;

  b.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();cur.screen=el.dataset.goto;render();}));
  b.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();cur.screen=el.dataset.tab;render();}));
  b.querySelectorAll('[data-ttab]').forEach(el=>el.addEventListener('click',()=>{cur.tripTab=el.dataset.ttab==='ongoing'?'ongoing':'completed';render();}));
  b.querySelectorAll('[data-etype]').forEach(el=>el.addEventListener('click',()=>{cur.expType=el.dataset.etype;render();}));
  b.querySelectorAll('[data-setlang]').forEach(el=>el.addEventListener('click',()=>setLang(el.dataset.setlang)));
}

function setLang(lg){ if(!L[lg])return; cur.lang=lg; document.getElementById('langMenu').style.display='none'; render(); }

/* ---------- controls ---------- */
document.getElementById('themeSeg').addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;cur.theme=x.dataset.theme;document.querySelectorAll('#themeSeg button').forEach(z=>z.classList.toggle('on',z===x));render();});
document.getElementById('stateSeg').addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;cur.state=x.dataset.state;document.querySelectorAll('#stateSeg button').forEach(z=>z.classList.toggle('on',z===x));render();});
document.getElementById('langSeg').addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;setLang(x.dataset.lang);});
document.getElementById('tabnav').addEventListener('click',e=>{const x=e.target.closest('.tab');if(!x)return;cur.screen=x.dataset.tab;render();});
document.getElementById('langBtn').addEventListener('click',e=>{e.stopPropagation();const m=document.getElementById('langMenu');m.style.display=m.style.display==='none'?'block':'none';});
document.getElementById('langMenu').addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;setLang(x.dataset.lang);});
document.addEventListener('click',()=>{document.getElementById('langMenu').style.display='none';});

/* deep link: #theme=truck&state=active&screen=tripsMine&lang=en */
(function(){const hp=new URLSearchParams(location.hash.slice(1));
  if(['car','truck'].includes(hp.get('theme')))cur.theme=hp.get('theme');
  if(['confirm','ready','active'].includes(hp.get('state')))cur.state=hp.get('state');
  if(['today','detail','tripsMine','expensesNew','expenseNew','me'].includes(hp.get('screen')))cur.screen=hp.get('screen');
  if(['vi','en','ko'].includes(hp.get('lang')))cur.lang=hp.get('lang');
  document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.theme===cur.theme));
  document.querySelectorAll('#stateSeg button').forEach(x=>x.classList.toggle('on',x.dataset.state===cur.state));
})();

render();
</script>
</body>
</html>

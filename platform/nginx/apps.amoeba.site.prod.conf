# =================================
# apps.amoeba.site (PRODUCTION) — host-mode nginx
# Recommended architecture: v2 served by Render prod service, reverse-proxied here.
# NO app-store platform containers on this box (see PLAN-20260601-프로덕션-v2-Render-안정배포.md).
#
# Render prod host: car-manager-production.onrender.com (filled 2026-06-04).
#
# ⚠️ PRECONDITION before deploying this: the Render prod service MUST be rebuilt
#    with BASE_PATH=/app-car-manager-v2 + NEXT_PUBLIC_BASE_PATH=/app-car-manager-v2.
#    As of 2026-06-04 it serves at ROOT (no basePath) → proxying under the
#    /app-car-manager-v2/ prefix would 404 assets/routes. Verify first:
#      curl https://car-manager-production.onrender.com/app-car-manager-v2/api/v1/health  → {"success":true}
#
# DEPLOY (after the above returns success):
#   1) sudo cp /etc/nginx/conf.d/apps.amoeba.site.conf{,.bak-20260604}
#   2) sudo cp apps.amoeba.site.prod.conf /etc/nginx/conf.d/apps.amoeba.site.conf
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) curl https://apps.amoeba.site/app-car-manager-v2/api/v1/health  → {"success":true}
# =================================

server {
    listen 80;
    listen [::]:80;
    server_name apps.amoeba.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name apps.amoeba.site;

    ssl_certificate     /etc/nginx/ssl/amoeba.site.crt;   # existing wildcard cert (unchanged)
    ssl_certificate_key /etc/nginx/ssl/amoeba.site.key;

    # Allow embedding inside AMA portal iframe
    add_header Content-Security-Policy "frame-ancestors 'self' https://ama.amoeba.site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # --- app-car-manager-v2 → Render prod (managed) ---
    # Host header = Render host (TLS SNI + Render routing).
    # X-Forwarded-Host = $host so v2 getRequestOrigin() returns apps.amoeba.site
    #   → cookies/redirects target the public origin, not *.onrender.com (INTEGRATION.md §6.3).
    location /app-car-manager-v2/ {
        proxy_pass            https://car-manager-production.onrender.com;
        proxy_set_header      Host               car-manager-production.onrender.com;
        proxy_set_header      X-Forwarded-Host   $host;
        proxy_set_header      X-Forwarded-Proto  $scheme;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade            $http_upgrade;
        proxy_set_header      Connection         "upgrade";
        proxy_ssl_server_name on;                 # Render requires SNI
        proxy_read_timeout    60s;
    }

    # --- Existing static root (unchanged) ---
    root /var/www/apps_amoeba;
    index index.html index.php;
    location / {
        try_files $uri $uri/ =404;
    }

    error_log  /var/log/nginx/apps.amoeba.site-error.log;
    access_log /var/log/nginx/apps.amoeba.site-access.log;
}

# =================================
# apps.amoeba.site (PRODUCTION) — host-mode nginx
# Recommended architecture: v2 served by Render prod service, reverse-proxied here.
# NO app-store platform containers on this box (see PLAN-20260601-프로덕션-v2-Render-안정배포.md).
#
# DEPLOY:
#   1) Replace <V2_PROD_RENDER_HOST> with the Render prod service host
#      (e.g. car-manager-prod.onrender.com) — TWO places below.
#   2) sudo cp /etc/nginx/conf.d/apps.amoeba.site.conf{,.bak-20260601}
#   3) sudo cp apps.amoeba.site.prod.conf /etc/nginx/conf.d/apps.amoeba.site.conf
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) curl https://apps.amoeba.site/app-car-manager-v2/api/v1/health  → {"success":true}
# =================================

server {
    listen 80;
    listen [::]:80;
    server_name apps.amoeba.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name apps.amoeba.site;

    ssl_certificate     /etc/nginx/ssl/amoeba.site.crt;   # existing wildcard cert (unchanged)
    ssl_certificate_key /etc/nginx/ssl/amoeba.site.key;

    # Allow embedding inside AMA portal iframe
    add_header Content-Security-Policy "frame-ancestors 'self' https://ama.amoeba.site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # --- app-car-manager-v2 → Render prod (managed) ---
    # Host header = Render host (TLS SNI + Render routing).
    # X-Forwarded-Host = $host so v2 getRequestOrigin() returns apps.amoeba.site
    #   → cookies/redirects target the public origin, not *.onrender.com (INTEGRATION.md §6.3).
    location /app-car-manager-v2/ {
        proxy_pass            https://<V2_PROD_RENDER_HOST>;
        proxy_set_header      Host               <V2_PROD_RENDER_HOST>;
        proxy_set_header      X-Forwarded-Host   $host;
        proxy_set_header      X-Forwarded-Proto  $scheme;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade            $http_upgrade;
        proxy_set_header      Connection         "upgrade";
        proxy_ssl_server_name on;                 # Render requires SNI
        proxy_read_timeout    60s;
    }

    # --- Existing static root (unchanged) ---
    root /var/www/apps_amoeba;
    index index.html index.php;
    location / {
        try_files $uri $uri/ =404;
    }

    error_log  /var/log/nginx/apps.amoeba.site-error.log;
    access_log /var/log/nginx/apps.amoeba.site-access.log;
}

# web-app-hscode nginx.
# 호스트 nginx가 /app-hscode/ 를 스트립하여 :5202/ 로 프록시하므로(root 경로 수신),
# root(location /)와 직접접근용 /app-hscode/ 를 모두 서빙한다. (구 web-hscode-manager와 동일 모델)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → BFF. (스테이징: 호스트 nginx가 /app-hscode/api 를 :3102로 직접 프록시하므로 미경유.
    #  로컬 standalone 에서만 사용)
    location /app-hscode/api/ {
        proxy_pass http://bff-app-hscode:3102/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location /app-hscode/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 직접 접근 (localhost:5202/app-hscode/)
    location /app-hscode/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # 호스트 nginx 스트립 경로 (/, /assets/...) SPA 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }
}

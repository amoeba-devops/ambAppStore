# Standalone web container (단독 로컬/검증용).
# 프로덕션은 플랫폼 web-platform nginx의 /app-hscode/ alias + /app-hscode/api/ 프록시를 사용.
server {
    listen 80;
    server_name _;

    # SPA — /app-hscode/ 하위 라우트는 index.html 로 폴백
    location /app-hscode/ {
        alias /usr/share/nginx/html/app-hscode/;
        try_files $uri $uri/ /app-hscode/index.html;
    }

    # API → BFF (compose 내부 네트워크)
    location /app-hscode/api/ {
        proxy_pass http://bff-app-hscode:3102/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 대용량 엑셀 업로드 허용
        client_max_body_size 25m;
    }

    location = / {
        return 302 /app-hscode/;
    }
}

services:
  - type: web
    name: sales-report-v2-web
    runtime: node
    rootDir: apps/app-sales-report-v2
    # BASE_PATH must be present at build time — Next.js inlines it into the
    # JS bundle. Render exports envVars to the build environment by default.
    buildCommand: npm install --include=dev && npm run build --workspace @v2/web
    startCommand: npm start --workspace @v2/web
    plan: starter
    # With BASE_PATH set, ALL routes (including /api/v1/*) are served under
    # that prefix. Render's health probe must hit the full path.
    healthCheckPath: /app-sales-report-v2/api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /app-sales-report-v2
      - key: APP_URL
        # User-facing origin used by getRequestOrigin() for redirects.
        # Matches the staging nginx domain so cookies stick.
        value: https://stg-apps.amoeba.site
      - key: SESSION_COOKIE_NAME
        # Distinct from car-manager-v2's `amb_session` to avoid cookie
        # collision on the shared stg-apps.amoeba.site origin.
        value: amb_session_sales
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_AMA_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_APP_CODE
        value: sales-report-v2
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: ko
      - key: DEMO_AUTO_LOGIN
        sync: false

  - type: worker
    name: sales-report-v2-worker
    runtime: node
    rootDir: apps/app-sales-report-v2
    buildCommand: npm install --include=dev && npm run build --workspace @v2/worker
    startCommand: npm start --workspace @v2/worker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: WORKER_POLL_INTERVAL_MS
        value: "2000"

  - type: cron
    name: sales-report-v2-daily-user-sync
    runtime: node
    rootDir: apps/app-sales-report-v2
    schedule: "0 19 * * *"
    buildCommand: npm install --include=dev && npm run build --workspace @v2/cron
    startCommand: npm start --workspace @v2/cron
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: sales-report-v2-retry-failed
    runtime: node
    rootDir: apps/app-sales-report-v2
    schedule: "*/15 * * * *"
    buildCommand: npm install --include=dev && npm run build --workspace @v2/cron
    startCommand: npm run start:retry-failed --workspace @v2/cron
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

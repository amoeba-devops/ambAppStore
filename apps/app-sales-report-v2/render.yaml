services:
  - type: web
    name: sales-report-v2-web
    runtime: node
    rootDir: apps/app-sales-report-v2
    buildCommand: npm install && npm run build --workspace @v2/web
    startCommand: npm start --workspace @v2/web
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_AMA_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_APP_CODE
        value: sales-report-v2
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: ko

  - type: worker
    name: sales-report-v2-worker
    runtime: node
    rootDir: apps/app-sales-report-v2
    buildCommand: npm install && npm run build --workspace @v2/worker
    startCommand: npm start --workspace @v2/worker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: WORKER_POLL_INTERVAL_MS
        value: "2000"

  - type: cron
    name: sales-report-v2-daily-user-sync
    runtime: node
    rootDir: apps/app-sales-report-v2
    schedule: "0 19 * * *"
    buildCommand: npm install && npm run build --workspace @v2/cron
    startCommand: npm start --workspace @v2/cron
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: sales-report-v2-retry-failed
    runtime: node
    rootDir: apps/app-sales-report-v2
    schedule: "*/15 * * * *"
    buildCommand: npm install && npm run build --workspace @v2/cron
    startCommand: npm run start:retry-failed --workspace @v2/cron
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

services:
  - type: web
    name: car-manager-v2-web
    runtime: node
    rootDir: apps/app-car-manager-v2
    buildCommand: npm install --include=dev && npm run build --workspace @car-v2/web
    startCommand: npm start --workspace @car-v2/web
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_AMA_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_APP_CODE
        value: car-manager-v2
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: vi
      - key: DEMO_AUTO_LOGIN
        sync: false

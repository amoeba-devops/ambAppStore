services:
  - type: web
    # MUST match the service name in Render dashboard. Mismatched name causes
    # Render to spin up a brand-new service instead of updating the existing
    # one. Current staging service URL: https://car-manager-staging.onrender.com
    name: car-manager-staging
    runtime: node
    rootDir: apps/app-car-manager-v2
    buildCommand: npm install --include=dev && npm run build --workspace @car-v2/web
    startCommand: npm start --workspace @car-v2/web
    plan: starter
    # No healthCheckPath — Render considers deploy successful as soon as the
    # process binds to $PORT. Verify manually after deploy with:
    #   curl https://car-manager-staging.onrender.com/api/v1/health
    # (no /app-car-manager-v2 prefix under D2 — Render serves at root)
    envVars:
      # D2 topology: Render serves at ROOT (no basePath). Staging Docker
      # serves under /app-car-manager-v2 (its own .env sets BASE_PATH).
      # → Render URL is clean: https://car-manager-staging.onrender.com/...
      #   instead of the redundant /app-car-manager-v2/ prefix.
      # → BASE_PATH intentionally OMITTED here (empty string also works,
      #   but omitting is cleaner — Next.js falls back to no basePath).
      #
      # Public origin override. For Render direct access, cookie domain +
      # redirect URLs must point to the onrender hostname (NOT stg-apps),
      # otherwise dev-login mints cookie on Render but redirects off-domain.
      - key: APP_URL
        value: https://car-manager-staging.onrender.com
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_AMA_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_APP_CODE
        value: car-manager-v2
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: vi
      - key: DEMO_AUTO_LOGIN
        sync: false
      # Module 2 (REQ-20260519) — same secret used by the optional cron job
      # below. Generated separately, set as dashboard env var. Required for
      # /api/v1/cron/maintenance-alert to authorize requests.
      - key: CRON_SECRET
        sync: false
      - key: EXPENSE_LOCK_DAYS
        value: "7"
      # ──────────────────────────────────────────────────────────────────────
      # P4 Notification transport — Resend (email) + Web Push (VAPID)
      # ──────────────────────────────────────────────────────────────────────
      # Email — Resend transactional. Domain must be verified on resend.com
      # with DKIM + SPF before EMAIL_FROM works. Leave blank to disable email
      # transport (in-app bell still fires).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      # Web Push (RFC 8030) — VAPID identifies our server to push providers.
      # Generate ONCE per environment with `npx web-push generate-vapid-keys`
      # and persist. Regenerating invalidates ALL existing subscriptions —
      # every device must re-subscribe via Settings → push toggle.
      #
      # PUBLIC + NEXT_PUBLIC_PUBLIC must match byte-for-byte. If they diverge
      # the browser rejects pushManager.subscribe() silently.
      - key: WEB_PUSH_VAPID_PRIVATE
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC
        sync: false
      - key: NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC
        sync: false
      - key: WEB_PUSH_CONTACT
        value: mailto:dev@amoeba.group

  # ============================================================================
  # PRODUCTION — apps.amoeba.site/app-car-manager-v2/ (behind host-mode nginx)
  # See docs/plan/RUNBOOK-20260603-프로덕션-v2-Render-배포실행.md
  #
  # Feature-parity with staging service above (P4 email/push, cron, expense lock)
  # — only BASE_PATH / APP_URL / NEXT_PUBLIC_AMA_ORIGIN diverge (build-time inline,
  #   so prod needs its OWN build — C2; staging image cannot be reused).
  # ⚠️ Render dashboard env takes priority over this file — clear stale overrides.
  # ⚠️ Pushing this provisions a NEW prod service. Only push after gate §6.
  # Verify: curl https://car-manager-production.onrender.com/app-car-manager-v2/api/v1/health
  # ⚠️ As of 2026-06-04 the live service serves at ROOT — set BASE_PATH below in the
  #    dashboard and rebuild (build-time inline) before nginx-proxying under the prefix.
  # ============================================================================
  - type: web
    name: car-manager-production        # MUST match the Render dashboard service name (actual: car-manager-production)
    runtime: node
    rootDir: apps/app-car-manager-v2
    buildCommand: npm install --include=dev && npm run build --workspace @car-v2/web
    startCommand: npm start --workspace @car-v2/web
    plan: starter
    envVars:
      # ── diverges from staging Render (prod is behind nginx at /app-car-manager-v2) ──
      - key: BASE_PATH                  # staging omits (root); prod matches the nginx prefix
        value: /app-car-manager-v2
      - key: NEXT_PUBLIC_BASE_PATH      # client asset prefix → avoids _next/static 404
        value: /app-car-manager-v2
      - key: APP_URL                    # getRequestOrigin() → public origin
        value: https://apps.amoeba.site
      - key: NEXT_PUBLIC_AMA_ORIGIN     # single concrete origin: CSP + session-expired redirect (BUG-260601)
        value: https://ama.amoeba.site
      - key: APP_STORE_API_URL          # prod value (staging = stg-apps) — platform catalog API
        value: https://apps.amoeba.site/api/v1
      # ── same as staging ──
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_CODE
        value: car-manager-v2
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: vi
      - key: AMA_API_BASE_URL           # AMA REST base (same host both envs)
        value: https://ama.amoeba.site/api/v1
      - key: SESSION_COOKIE_NAME
        value: amb_session
      - key: EXPENSE_LOCK_DAYS
        value: "7"
      - key: WEB_PUSH_CONTACT
        value: mailto:dev@amoeba.group
      - key: DEMO_AUTO_LOGIN            # MUST stay false in prod
        value: "false"
      # ── secrets (enter in dashboard; sync:false keeps them out of git) ──
      - key: JWT_SECRET                 # byte-for-byte == prod AMA (amb-api-production) — gate G1
        sync: false
      - key: DATABASE_URL               # Neon PROD branch pooler URL (isolated from staging)
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CRON_SECRET                # same value as the prod cron job, if enabled
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC
        sync: false
      - key: NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC
        sync: false
      - key: GOOGLE_PLACES_API_KEY      # address autocomplete (reused across envs)
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY
        sync: false

  # ──────────────────────────────────────────────────────────────────────────
  # Module 2 maintenance-alert evaluator (REQ-20260519 D9).
  #
  # Deferred since May with the endpoint already written; activated 2026-07-28
  # now that (a) /maintenance renders the alerts and (b) submitting an OIL
  # expense resolves them and restarts the vehicle's oil clock. Without (b) a
  # daily run would just re-raise the same alert for every overdue vehicle
  # forever — so do NOT re-enable this ahead of resolveOpenOilAlerts.
  #
  # STAGING ONLY for now, per the repo rule that nothing reaches production
  # before staging is green. To add production later, copy this block, rename
  # it, and point TARGET_URL at the prod URL — one cron service per target.
  #
  # `runtime: node` mirrors the two web services above (a proven config in this
  # blueprint) and runs the existing trigger script, which exits non-zero on a
  # non-2xx so Render marks the run failed. The version previously sketched
  # here could not have worked: it used `runtime: docker` with no rootDir (no
  # Dockerfile at the repo root) and shelled out to curl, which the app image
  # does not carry — node:20-alpine + `apk add wget`, no curl.
  # ──────────────────────────────────────────────────────────────────────────
  - type: cron
    name: car-manager-maintenance-alert
    runtime: node
    rootDir: apps/app-car-manager-v2
    plan: starter
    # Daily at 06:00 ICT = 23:00 UTC the previous day.
    schedule: "0 23 * * *"
    # Nothing to compile — the job is one HTTP call via node's global fetch.
    buildCommand: "echo 'no build: cron only issues one HTTP request'"
    startCommand: node scripts/trigger-maintenance-cron.mjs
    envVars:
      # MUST match CRON_SECRET on car-manager-staging or the endpoint 401s.
      - key: CRON_SECRET
        sync: false
      - key: TARGET_URL
        value: https://car-manager-staging.onrender.com
